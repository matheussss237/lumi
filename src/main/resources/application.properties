spring.application.name=lumi
# aplicação desktop: sem servidor web
spring.main.web-application-type=none

# MongoDB Atlas - a URI vem da variável de ambiente MONGODB_URI (nunca escreva a senha aqui)
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:lumi}
spring.data.mongodb.auto-index-creation=true

# Groq - a chave vem da variável de ambiente GROQ_API_KEY
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# e-mail (opcional): SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# as chaves também podem ficar em %USERPROFILE%\.lumi\config.properties (lido pela classe ConfiguracaoLocal)

logging.level.root=WARN
